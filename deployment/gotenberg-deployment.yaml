apiVersion: apps/v1
kind: Deployment
metadata:
    name: gotenberg
    namespace: gotenberg
    labels:
        app: gotenberg
spec:
    replicas: 1
    selector:
        matchLabels:
            app: gotenberg
    template:
        metadata:
            labels:
                app: gotenberg
        spec:
            containers:
                - name: gotenberg
                  image: gotenberg/gotenberg:8.34.0-chromium
                  imagePullPolicy: IfNotPresent
                  ports:
                      - name: http
                        containerPort: 3000
                        protocol: TCP
                  resources:
                      requests:
                          cpu: 100m
                          memory: 256Mi
                      limits:
                          cpu: "1"
                          memory: 1Gi
                  startupProbe:
                      httpGet:
                          path: /health
                          port: http
                      failureThreshold: 30
                      periodSeconds: 2
                  readinessProbe:
                      httpGet:
                          path: /health
                          port: http
                      periodSeconds: 10
                      timeoutSeconds: 3
                      failureThreshold: 3
                  livenessProbe:
                      httpGet:
                          path: /health
                          port: http
                      periodSeconds: 20
                      timeoutSeconds: 3
                      failureThreshold: 3
                  securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                          drop:
                              - ALL
                  volumeMounts:
                      - name: tmp
                        mountPath: /tmp
            volumes:
                - name: tmp
                  emptyDir: {}
