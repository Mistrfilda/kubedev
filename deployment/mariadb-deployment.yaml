apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: mariadb
spec:
    serviceName: "mariadb"
    replicas: 1
    selector:
        matchLabels:
            app: mariadb
    template:
        metadata:
            labels:
                app: mariadb
        spec:
            terminationGracePeriodSeconds: 120
            containers:
                - image: localhost:32000/my-mariadb:11.4.13
                  name: mariadb
                  startupProbe:
                      exec:
                          command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 60
                  readinessProbe:
                      exec:
                          command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
                      periodSeconds: 5
                      timeoutSeconds: 5
                      failureThreshold: 3
                  env:
                      - name: MARIADB_AUTO_UPGRADE
                        value: "1"
                      - name: MYSQL_ROOT_PASSWORD
                        value: my-secret-pw
                  ports:
                      - containerPort: 3306
                        name: mariadb
                  volumeMounts:
                      - name: mariadb-storage
                        mountPath: /var/lib/mysql
            volumes:
                - name: mariadb-storage
                  persistentVolumeClaim:
                      claimName: mariadb-pvc
