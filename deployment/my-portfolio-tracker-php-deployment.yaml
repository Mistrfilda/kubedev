apiVersion: apps/v1
kind: Deployment
metadata:
    name: php-deployment
spec:
    replicas: 1
    selector:
        matchLabels:
            app: my-pt-php-app
    template:
        metadata:
            labels:
                app: my-pt-php-app
        spec:
            initContainers:
                - name: oauth-volume-permissions
                  image: 192.168.1.245:32000/my-portfolio-tracker-php:1.376
                  command: ["/bin/sh", "-ec"]
                  args:
                      - |
                          chown -R www-data:www-data /var/resources/oauth
                          chmod 0700 /var/resources/oauth
                  securityContext:
                      runAsUser: 0
                  volumeMounts:
                      - name: oauth
                        mountPath: /var/resources/oauth
            containers:
                - name: php-container
                  image: 192.168.1.245:32000/my-portfolio-tracker-php:1.376
                  ports:
                      - containerPort: 9000
                  volumeMounts:
                      - name: log-data
                        mountPath: /var/log
                      - name: puppeter
                        mountPath: /var/puppeter/files
                      - name: gemini
                        mountPath: /var/resources/gemini
                      - name: oauth
                        mountPath: /var/resources/oauth
            volumes:
                - name: log-data
                  persistentVolumeClaim:
                      claimName: my-pt-log-pvc
                - name: puppeter
                  persistentVolumeClaim:
                      claimName: my-pt-puppeter-pvc
                - name: gemini
                  persistentVolumeClaim:
                      claimName: my-pt-gemini-pvc
                - name: oauth
                  persistentVolumeClaim:
                      claimName: my-pt-oauth-pvc
